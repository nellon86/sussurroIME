name: probe
on: push
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1
          curl -fsSL -o a.aar $B/sherpa-onnx-static-link-onnxruntime-2.0.1.aar; mkdir a; unzip -q a.aar -d a
          echo AAR; find a -name '*arm64*' -o -name '*.so' | grep arm64; ls -la a/jni/arm64-v8a
          readelf -d a/jni/arm64-v8a/libsherpa-onnx-jni.so | grep NEEDED
          curl -fsSL -o t.tbz $B/sherpa-onnx-v2.0.1-android-static-link-onnxruntime.tar.bz2; mkdir t; tar xjf t.tbz -C t
          echo TAR; find t | grep arm64; ls -la t/jniLibs/arm64-v8a
          readelf -d t/jniLibs/arm64-v8a/libsherpa-onnx-jni.so | grep NEEDED
          readelf -Ws --dyn-syms t/jniLibs/arm64-v8a/libsherpa-onnx-jni.so | grep -c OrtGetApiBase
          sha256sum t/jniLibs/arm64-v8a/*.so a/jni/arm64-v8a/*.so
